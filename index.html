<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteShare — Global Student Academic Notes Sharing</title>
    <meta name="description" content="Access peer-verified lecture notes, exam study guides, formula sheets, and lab reports from university students worldwide." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NoteShare" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme') || localStorage.getItem('noteshare_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || stored === 'anime' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          var root = document.documentElement;
          if (stored === 'light' || (!isDark && stored !== 'dark' && stored !== 'anime')) {
            root.classList.remove('dark', 'anime-mode');
            root.classList.add('light');
            root.style.colorScheme = 'light';
          } else if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.colorScheme = 'dark';
            if (stored === 'anime') {
              root.classList.add('anime-mode');
            } else {
              root.classList.remove('anime-mode');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-150 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
